name: Deploy PWA a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base del proyecto Pages: /<nombre-del-repo>/
      - run: npx vite build --base=/smart-picks-pwa/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # redirige al user site (MikeV23k.github.io) para que también publique
  # la app en la raíz https://mikev23k.github.io/
  notify-root:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: repository_dispatch → MikeV23k/MikeV23k.github.io
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MikeV23k/MikeV23k.github.io/dispatches \
            -d '{"event_type":"smart-picks-push"}'
